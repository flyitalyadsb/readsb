name: sync upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # A push made with GITHUB_TOKEN starts no workflow, so the merge below never
  # triggered docker.yaml: a new upstream commit reached the image only at the
  # weekly rebuild. The step after the merge starts the build explicitly.
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Merge wiedehopf/readsb dev into dev
        id: merge
        run: |
          git remote add upstream https://github.com/wiedehopf/readsb.git
          git fetch upstream dev

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse upstream/dev)" ]; then
            echo "Already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Real merge, not --ff-only: our dev always carries fork-local patches
          # (UUID printing, --net-receiver-id build targets, etc.) that diverge
          # from upstream/dev, so a fast-forward-only merge would refuse every
          # single day (see git history: this step failed on every scheduled
          # run since it was added). A normal merge keeps those patches and
          # folds in upstream's commits on top; it only fails when upstream
          # touched the same lines our patches touch, which is the case that
          # actually needs a human.
          before=$(git rev-parse HEAD)
          if git merge --no-edit upstream/dev; then
            # Our dev never equals upstream/dev (fork patches), so this merge
            # runs every day and is usually "Already up to date". Only a merge
            # that made a commit is news: only then push and build.
            if [ "$(git rev-parse HEAD)" != "$before" ]; then
              git push origin dev
              echo "merged=1" >> "$GITHUB_OUTPUT"
            fi
          else
            git merge --abort
            echo "::error::Merge conflict with upstream/dev — fork patches overlap upstream changes, needs a manual merge"
            exit 1
          fi
      - name: Build the merged commit (it becomes the canary for cell B)
        if: steps.merge.outputs.merged == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        # --repo: with a remote named "upstream" in this checkout, gh picks it
        # (wiedehopf/readsb) as the repository and the call fails with 403.
        # It failed on 25, 26 and 27/10: the merges were pushed, never built.
        run: gh workflow run docker.yaml --ref dev --repo "$GITHUB_REPOSITORY"
