name: sync upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Merge wiedehopf/readsb dev into dev
        run: |
          git remote add upstream https://github.com/wiedehopf/readsb.git
          git fetch upstream dev

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse upstream/dev)" ]; then
            echo "Already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Real merge, not --ff-only: our dev always carries fork-local patches
          # (UUID printing, --net-receiver-id build targets, etc.) that diverge
          # from upstream/dev, so a fast-forward-only merge would refuse every
          # single day (see git history: this step failed on every scheduled
          # run since it was added). A normal merge keeps those patches and
          # folds in upstream's commits on top; it only fails when upstream
          # touched the same lines our patches touch, which is the case that
          # actually needs a human.
          if git merge --no-edit upstream/dev; then
            git push origin dev
          else
            git merge --abort
            echo "::error::Merge conflict with upstream/dev — fork patches overlap upstream changes, needs a manual merge"
            exit 1
          fi
