name: docker build

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}
  push:
    branches:
      - "dev"
      - "sid"
    # flyitalyadsb: a change to the workflows alone doesn't change the image (the
    # Dockerfile never reads .github/), and every new dev image is a canary that
    # restarts cell B's readsb. A push that also touches anything else still builds.
    paths-ignore:
      - ".github/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "dev"

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
    - name: Set variables useful for later
      id: useful_vars
      run: |-
        echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT
        echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
    - name: Checkout
      uses: actions/checkout@v7
    - name: Docker meta
      id: docker_meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,prefix=,format=long
          type=sha
          type=raw,value=latest,enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
          type=raw,value=${{ github.ref_name }}-${{ steps.useful_vars.outputs.short_sha }}-${{ steps.useful_vars.outputs.timestamp }},enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.docker_meta.outputs.tags }}
        labels: ${{ steps.docker_meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        build-args: |
          BUILDKIT_CONTEXT_KEEP_GIT_DIR=true
        outputs: type=image,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
    # flyitalyadsb: the canary for cell B, in its OWN repository. Every build of
    # dev is one: a push, the dispatch from sync-upstream after a merge, and the
    # weekly rebuild. The weekly rebuild is not a no-op, because the image
    # downloads the aircraft database (tar1090-db aircraft.csv.gz) at build time.
    # argocd-image-updater in nesso-infra follows readsb-canary:canary for cell B
    # and readsb:stable for cell A; promote.yaml copies a canary that held up to
    # stable. A separate repository, not a second tag: with two aliases on one
    # repository argocd-image-updater v1.1.1 drops one cell's override when it
    # writes the other's (it happened on 2026-10-23).
    - name: Publish the canary for cell B
      if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
      run: >-
        docker buildx imagetools create
        --tag ghcr.io/${{ github.repository }}-canary:canary
        ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
