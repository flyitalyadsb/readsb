name: docker build

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}
  push:
    branches:
      - "dev"
      - "sid"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "dev"

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
    - name: Set variables useful for later
      id: useful_vars
      run: |-
        echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT
        echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
    - name: Checkout
      uses: actions/checkout@v7
    - name: Docker meta
      id: docker_meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,prefix=,format=long
          type=sha
          # flyitalyadsb: `canary` is what cell B runs (argocd-image-updater in
          # nesso-infra follows it). It moves only for a build of a NEW commit on
          # dev: a push, or the dispatch from sync-upstream after a merge. The
          # weekly schedule rebuilds the same commit and must not redeploy it.
          # promote.yaml later copies a canary that held up on cell B to `stable`,
          # which cell A runs.
          type=raw,value=canary,enable=${{ github.ref == 'refs/heads/dev' && github.event_name != 'schedule' && github.event_name != 'pull_request' }}
          type=raw,value=latest,enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
          type=raw,value=${{ github.ref_name }}-${{ steps.useful_vars.outputs.short_sha }}-${{ steps.useful_vars.outputs.timestamp }},enable=${{ endsWith(github.ref, github.event.repository.default_branch) }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.docker_meta.outputs.tags }}
        labels: ${{ steps.docker_meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        build-args: |
          BUILDKIT_CONTEXT_KEEP_GIT_DIR=true
        outputs: type=image,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
